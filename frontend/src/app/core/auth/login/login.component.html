<div class="login-shell">
  <!-- Glows decorativos -->
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <!-- Columna izquierda - Branding (solo desktop) -->
  <div class="brand-column">
    <div class="brand-center">
      <h1 class="brand-title">Sweet Day</h1>
      <p class="brand-subtitle">Sistema de Gestión Inteligente</p>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Columna derecha - Formulario -->
  <div class="form-column">
    <div class="form-wrap">

      <!-- Branding mobile -->
      <div class="brand-mobile">
        <h1 class="brand-title brand-title--sm">Sweet<em>Day</em></h1>
      </div>

      <div class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form (ngSubmit)="onSubmit()">
          <label>
            <span>Email</span>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" placeholder="tu@sweetday.com" />
            </div>
          </label>

          <label>
            <span>Contraseña</span>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" placeholder="••••••••" />
            </div>
          </label>

          @if (error()) {
            <p class="error" role="alert" aria-live="assertive">{{ error() }}</p>
          }

          <button type="submit" [disabled]="cargando()">
            {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
